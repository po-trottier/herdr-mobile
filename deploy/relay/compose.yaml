# Relay-only deployment profile: R-14-010.
# Directory and optional local environment: R-14-024.
# The operator supplies the TLS ingress outside this repository.
services:
  relay:
    image: ghcr.io/po-trottier/herdr-relay-hub:latest
    container_name: herdr-relay-hub
    restart: unless-stopped
    ports: ["${RELAY_BIND:-127.0.0.1:8080}:8080"]
    environment:
      HERDR_RELAY_LISTEN: "0.0.0.0:8080"
      HERDR_RELAY_METRICS_LISTEN: "0.0.0.0:9090"
      HERDR_RELAY_MAX_HANDLES: "4096"
      HERDR_RELAY_CONNECTION_RATE: "10"
      HERDR_RELAY_FRAME_RATE: "100"
      HERDR_RELAY_HANDLE_RATE: "5"
      HERDR_RELAY_LOG_JSON: "true"
      # Optional push providers (R-14-016 to R-14-018). Every value comes from the project's
      # `.env`; an empty value leaves that provider off. The two credential files live in
      # `${RELAY_SECRETS_DIR}` on the host (default `./secrets`, gitignored) under fixed names,
      # so the `.env` carries no path and the compose file never changes per deployment.
      HERDR_RELAY_APNS_KEY_FILE: "${HERDR_RELAY_APNS_KEY_ID:+/run/secrets/apns.p8}"
      HERDR_RELAY_APNS_KEY_ID: "${HERDR_RELAY_APNS_KEY_ID:-}"
      HERDR_RELAY_APNS_TEAM_ID: "${HERDR_RELAY_APNS_TEAM_ID:-}"
      HERDR_RELAY_APNS_BUNDLE_ID: "${HERDR_RELAY_APNS_BUNDLE_ID:-}"
      HERDR_RELAY_APNS_SANDBOX: "${HERDR_RELAY_APNS_SANDBOX:-false}"
      HERDR_RELAY_FCM_SERVICE_ACCOUNT_FILE: "${HERDR_RELAY_FCM_ENABLED:+/run/secrets/firebase-service-account.json}"
    volumes:
      - "${RELAY_SECRETS_DIR:-./secrets}:/run/secrets:ro"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
